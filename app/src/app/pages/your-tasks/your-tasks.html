<div class="bg-white shadow-md rounded-lg">
  <div class="px-4 py-5 sm:p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Your Tasks</h1>

      <!-- Add Task Button and View Mode Toggle -->
      <div class="flex items-center gap-4">
        <!-- Add Task Button -->
        <button type="button"
          class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-primary hover:bg-primary-100 focus:outline-none focus:ring-0 active:outline-none">
          <ng-icon name="heroPlus" class="-ml-1 mr-2 h-5 w-5"></ng-icon>
          Add Task
        </button>

        <!-- View Mode Toggle -->
        <div class="flex bg-gray-100 rounded-lg p-1">
          <button type="button" (click)="setViewMode('list')" [class]="currentView === 'list'
            ? 'bg-white text-gray-900 shadow-sm'
            : 'text-gray-500 hover:text-gray-700'"
            class="px-3 py-2 text-sm font-medium rounded-md transition-colors duration-200 focus:outline-none focus:ring-0 active:outline-none">
            <ng-icon name="heroBars3" class="w-4 h-4 mr-2 inline"></ng-icon>
            List
          </button>
          <button type="button" (click)="setViewMode('calendar')" [class]="currentView === 'calendar'
            ? 'bg-white text-gray-900 shadow-sm'
            : 'text-gray-500 hover:text-gray-700'"
            class="px-3 py-2 text-sm font-medium rounded-md transition-colors duration-200 focus:outline-none focus:ring-0 active:outline-none">
            <ng-icon name="heroCalendarDays" class="w-4 h-4 mr-2 inline"></ng-icon>
            Calendar
          </button>
        </div>
      </div>
    </div>

    <!-- Conditional View Rendering -->
    @if (currentView === 'list') {
    <app-task-list-view [tasks]="tasks()" [isLoading]="isLoadingAndEmptyTasks()"></app-task-list-view>
    } @else if (currentView === 'calendar') {
    <app-calendar-view [tasks]="tasks()" [isLoading]="isLoadingAndEmptyTasks()"></app-calendar-view>
    }
  </div>
</div>
