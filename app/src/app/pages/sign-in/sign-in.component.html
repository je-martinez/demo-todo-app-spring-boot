<div class="w-full max-w-md mx-auto">
  <!-- Header -->
  <div class="text-center mb-8">
    <h2 class="text-4xl font-bold text-blue-700 mb-2">Login</h2>
    <p class="text-gray-600">Sign in to your account</p>
  </div>

  <!-- Form -->
  <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Email Field -->
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <ng-icon name="heroEnvelope" class="h-5 w-5 text-gray-400"></ng-icon>
        </div>
        <input id="email" type="email" formControlName="email"
          class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
          placeholder="Enter your email" />
      </div>
      @if (emailError) {
      <div class="mt-1 text-sm text-red-600">
        {{ emailError }}
      </div>
      }
    </div>

    <!-- Password Field -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <ng-icon name="heroLockClosed" class="h-5 w-5 text-gray-400"></ng-icon>
        </div>
        <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
          class="block w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
          placeholder="Enter your password" />
        <button type="button" (click)="togglePasswordVisibility()" tabindex="-1"
          class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition duration-200">
          @if (!showPassword()) {
          <ng-icon name="heroEye" class="h-5 w-5"></ng-icon>
          } @else {
          <ng-icon name="heroEyeSlash" class="h-5 w-5"></ng-icon>
          }
        </button>
      </div>
      @if (passwordError) {
      <div class="mt-1 text-sm text-red-600">
        {{ passwordError }}
      </div>
      }
    </div>

    <!-- Submit Button -->
    <button type="submit" [disabled]="isLoading()"
      class="w-full bg-blue-700 hover:bg-blue-800 disabled:bg-blue-400 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center">
      @if (!isLoading()) {
      <span>Log in</span>
      } @else {
      <app-loading-spinner size="md" color="text-white" [showText]="true" text="Signing in...">
      </app-loading-spinner>
      }
    </button>
  </form>

  <!-- Register Link -->
  <div class="mt-8 text-center">
    <p class="text-gray-600">
      Don't have an account?
      <button (click)="onRegisterClick()"
        class="text-blue-700 hover:text-blue-800 font-semibold transition duration-200">
        Register
      </button>
    </p>
  </div>
</div>
