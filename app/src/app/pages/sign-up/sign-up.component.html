<div class="w-full max-w-md mx-auto">
  <!-- Header -->
  <div class="text-center mb-8">
    <h2 class="text-4xl font-bold text-primary mb-2">Sign Up</h2>
    <p class="text-gray-600">Create your account</p>
  </div>

  <!-- Form -->
  <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Name Fields -->
    <div class="grid grid-cols-2 gap-4">
      <!-- First Name Field -->
      <div>
        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
        <input id="firstName" type="text" formControlName="firstName"
          class="block w-full px-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200"
          placeholder="First name" />
        @if (firstNameError) {
        <div class="mt-1 text-sm text-red-600">
          {{ firstNameError }}
        </div>
        }
      </div>

      <!-- Last Name Field -->
      <div>
        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
        <input id="lastName" type="text" formControlName="lastName"
          class="block w-full px-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200"
          placeholder="Last name" />
        @if (lastNameError) {
        <div class="mt-1 text-sm text-red-600">
          {{ lastNameError }}
        </div>
        }
      </div>
    </div>

    <!-- Email Field -->
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <ng-icon name="heroEnvelope" class="h-5 w-5 text-gray-400"></ng-icon>
        </div>
        <input id="email" type="email" formControlName="email"
          class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200"
          placeholder="Enter your email" />
      </div>
      @if (emailError) {
      <div class="mt-1 text-sm text-red-600">
        {{ emailError }}
      </div>
      }
    </div>

    <!-- Password Field -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <ng-icon name="heroLockClosed" class="h-5 w-5 text-gray-400"></ng-icon>
        </div>
        <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
          class="block w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200"
          placeholder="Create a password" />
        <button type="button" (click)="togglePasswordVisibility()" tabindex="-1"
          class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition duration-200">
          @if (!showPassword()) {
          <ng-icon name="heroEye" class="h-5 w-5"></ng-icon>
          } @else {
          <ng-icon name="heroEyeSlash" class="h-5 w-5"></ng-icon>
          }
        </button>
      </div>
      @if (passwordError) {
      <div class="mt-1 text-sm text-red-600">
        {{ passwordError }}
      </div>
      }
    </div>

    <!-- Confirm Password Field -->
    <div>
      <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <ng-icon name="heroLockClosed" class="h-5 w-5 text-gray-400"></ng-icon>
        </div>
        <input id="confirmPassword" [type]="showConfirmPassword() ? 'text' : 'password'"
          formControlName="confirmPassword"
          class="block w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200"
          placeholder="Confirm your password" />
        <button type="button" (click)="toggleConfirmPasswordVisibility()" tabindex="-1"
          class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition duration-200">
          @if (!showConfirmPassword()) {
          <ng-icon name="heroEye" class="h-5 w-5"></ng-icon>
          } @else {
          <ng-icon name="heroEyeSlash" class="h-5 w-5"></ng-icon>
          }
        </button>
      </div>
      @if (confirmPasswordError) {
      <div class="mt-1 text-sm text-red-600">
        {{ confirmPasswordError }}
      </div>
      }
    </div>

    <!-- Submit Button -->
    <button type="submit" [disabled]="isLoading()"
      class="w-full bg-primary hover:bg-primary-600 disabled:bg-primary-300 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center">
      @if (!isLoading()) {
      <span>Create Account</span>
      } @else {
      <app-loading-spinner size="md" color="text-white" [showText]="true" text="Creating account...">
      </app-loading-spinner>
      }
    </button>
  </form>

  <!-- Sign In Link -->
  <div class="mt-8 text-center">
    <p class="text-gray-600">
      Already have an account?
      <button (click)="onSignInClick()"
        class="text-primary hover:text-primary-600 font-semibold transition duration-200">
        Sign in
      </button>
    </p>
  </div>
</div>
