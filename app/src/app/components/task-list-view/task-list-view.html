<div class="bg-white shadow rounded-lg">
  <div class="px-4 py-5 sm:p-6">
    <div class="text-center py-12">
      <div class="text-gray-500">
        <ng-icon name="heroClipboardDocumentList" class="mx-auto h-12 w-12 text-gray-400"></ng-icon>
        <h3 class="mt-2 text-sm font-medium text-gray-900">No tasks yet</h3>
        <p class="mt-1 text-sm text-gray-500">Get started by creating your first task.</p>
        <div class="mt-6">
          <button type="button"
            class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            <ng-icon name="heroPlus" class="-ml-1 mr-2 h-5 w-5"></ng-icon>
            Add Task
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
