@if (isLoading()) {
<div class="bg-white shadow rounded-lg p-6">
  <div class="animate-pulse space-y-4">
    @for (i of [1, 2, 3]; track i) {
    <div class="h-20 bg-gray-200 rounded"></div>
    }
  </div>
</div>
} @else if (tasks().length === 0) {
<div class="bg-white shadow rounded-lg">
  <div class="px-4 py-5 sm:p-6">
    <div class="text-center py-12">
      <div class="text-gray-500">
        <ng-icon name="heroClipboardDocumentList" class="mx-auto h-12 w-12 text-gray-400"></ng-icon>
        <h3 class="mt-2 text-sm font-medium text-gray-900">No tasks yet</h3>
        <p class="mt-1 text-sm text-gray-500">Get started by creating your first task.</p>
      </div>
    </div>
  </div>
</div>
} @else {
<div class="bg-white rounded-lg overflow-hidden">
  <ul class="divide-y divide-gray-200">
    @for (task of tasks(); track task.id) {
    <app-task-item [task]="task" (onEdit)="handleEditTask($event)"></app-task-item>
    }
  </ul>
</div>
}
