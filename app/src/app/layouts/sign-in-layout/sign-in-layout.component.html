<div class="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center p-4">
  <div class="w-full max-w-6xl bg-white rounded-2xl shadow-2xl overflow-hidden">
    <div class="flex h-min-[600px]">
      <!-- Left side - Logo and illustration -->
      <div class="flex-1 bg-gradient-to-br from-blue-50 to-blue-100 p-12 flex flex-col justify-center items-center">
        <!-- Logo -->
        <div class="flex items-center mb-8">
          <div class="w-10 h-10 bg-blue-700 rounded-lg flex items-center justify-center mr-3">
            <ng-icon name="heroCheckCircle" class="w-6 h-6 text-white"></ng-icon>
          </div>
          <h1 class="text-3xl font-bold text-blue-700">Listify</h1>
        </div>

        <!-- Illustration -->
        <div class="relative">
          <div class="w-64 h-80 bg-white rounded-2xl shadow-lg flex items-center justify-center">
            <!-- Man illustration placeholder -->
            <div class="text-center">
              <div class="w-32 h-32 bg-blue-200 rounded-full mx-auto mb-4 flex items-center justify-center">
                <ng-icon name="heroUser" class="w-16 h-16 text-blue-600"></ng-icon>
              </div>
              <div class="w-20 h-24 bg-blue-700 rounded-lg mx-auto flex items-center justify-center">
                <ng-icon name="heroClipboardDocumentList" class="w-8 h-8 text-white"></ng-icon>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right side - Form content -->
      <div class="flex-1 p-12 flex flex-col justify-center">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
